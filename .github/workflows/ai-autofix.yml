name: AI Autofix (PR to test)

on:
  push:
    branches: [ test ]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  fix:
    # Bot-Commits nicht erneut triggern (Sicherheitsnetz zusätzlich zu [skip ci])
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    runs-on: ubuntu-latest
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v6
        with:
          ref: test
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests

      - name: Run AI fixer
        id: fix
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python scripts/ai_fix.py
          echo "changed=$(cat /tmp/ai_fix_changed 2>/dev/null || echo 0)" >> "$GITHUB_OUTPUT"

      - name: Create PR to test
        if: steps.fix.outputs.changed != '0'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: test
          branch: ai/autofix-${{ github.run_id }}
          delete-branch: true
          title: "[AI] Autofix Vorschlag"
          body: |
            Automatisch erzeugt vom AI-Autofix-Workflow.

            **Bitte prüfen und manuell mergen.** Der Bot hat Code geändert,
            ohne zu kompilieren.

            - Quellbranch: `test`
            - Zielbranch: `test`
            - Lauf-ID: `${{ github.run_id }}`
            - Auslöser: `${{ github.event_name }}` von `${{ github.actor }}`
          labels: |
            automated
            ai-autofix

      - name: Summary
        if: always()
        run: |
          echo "changed=$(cat /tmp/ai_fix_changed 2>/dev/null || echo 0)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Kein direkter Commit auf test — bei Änderungen wurde ein PR erstellt." >> "$GITHUB_STEP_SUMMARY"
          echo "PR manuell prüfen und mergen." >> "$GITHUB_STEP_SUMMARY"
