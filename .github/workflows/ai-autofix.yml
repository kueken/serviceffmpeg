name: AI Autofix (test branch only)

on:
  push:
    branches: [ test ]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          ref: test
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests

      - name: Run AI fixer
        id: fix
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python scripts/ai_fix.py
          echo "changed=$(cat /tmp/ai_fix_changed 2>/dev/null || echo 0)" >> "$GITHUB_OUTPUT"

      - name: Commit and push if changed
        if: steps.fix.outputs.changed != '0'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(ai-autofix): automated code improvements [skip ci]" || echo "nothing to commit"
          git push origin test

      - name: Open / update PR test -> main
        if: steps.fix.outputs.changed != '0'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: auto-pr/test-to-main
          delete-branch: true
          title: "[Auto] AI-Autofix: test → main"
          body: |
            Automatisch erzeugt vom AI-Autofix-Workflow.

            - Quellbranch: `test`
            - Zielbranch: `main`
            - Commit: `${{ github.sha }}`
            - Auslöser: `${{ github.event_name }}` von `${{ github.actor }}`

            **Bitte vor dem Merge prüfen** — der Bot hat Code geändert, ohne zu kompilieren.
          labels: |
            automated
            ai-autofix
