name: AI Autofix (test branch only, no PR)

on:
  push:
    branches: [ test ]
  workflow_dispatch:

permissions:
  contents: write          # nur noch zum Pushen auf test nötig
  # pull-requests: write   # entfernt — der Bot erstellt keine PRs mehr

jobs:
  fix:
    # Bot-Commits nicht erneut triggern (Sicherheitsnetz zusätzlich zu [skip ci])
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    runs-on: ubuntu-latest
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v6
        with:
          ref: test
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests

      - name: Run AI fixer
        id: fix
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python scripts/ai_fix.py
          echo "changed=$(cat /tmp/ai_fix_changed 2>/dev/null || echo 0)" >> "$GITHUB_OUTPUT"

      - name: Commit and push to test
        if: steps.fix.outputs.changed != '0'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "chore(ai-autofix): automated code improvements [skip ci]"
          git push origin test

      - name: Summary
        if: always()
        run: |
          echo "changed=$(cat /tmp/ai_fix_changed 2>/dev/null || echo 0)" >> "$GITHUB_STEP_SUMMARY"
          echo "Lauf abgeschlossen. Kein PR erstellt — manueller Merge nach main bleibt deine Entscheidung." >> "$GITHUB_STEP_SUMMARY"
