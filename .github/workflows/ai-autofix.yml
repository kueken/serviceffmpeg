name: AI Autofix

# Wie Dependabot: läuft automatisch (wöchentlich) oder per Knopfdruck und
# öffnet EINEN Pull Request gegen "test". Annehmen/Ablehnen machst du manuell.
# Der Branch "ai/autofix" wird nach Merge ODER Schließen automatisch gelöscht
# (siehe ai-autofix-cleanup.yml).
#
# push-Trigger NUR für die Testphase auf "test": startet nur, wenn Workflow oder Skript
# selbst geändert werden. Der Merge des Bot-PRs ändert nur serviceffmpeg/** und löst
# daher keinen neuen Lauf aus (keine Endlosschleife). Nach dem Übertrag nach main kann
# der push-Block entfernt werden.

on:
  push:
    branches: [test]
    paths:
      - ".github/workflows/ai-autofix.yml"
      - ".github/ai-autofix-refmap.json"
      - "scripts/ai_fix_single.py"
  workflow_dispatch:
    inputs:
      reference_repo:
        description: "Referenz-Repo (owner/name). Leer = Standard aus env, 'none' = ohne Vergleich"
        required: false
        default: ""
      reference_ref:
        description: "Branch/Tag/SHA des Referenz-Repos (leer = Standard aus env)"
        required: false
        default: ""
      reference_subdir:
        description: "Unterordner im Referenz-Repo (optional)"
        required: false
        default: ""
      focus:
        description: "Optionaler Prüfschwerpunkt, z. B. 'Speicherlecks in Demuxer-Pfaden'"
        required: false
        default: ""
      max_files:
        description: "Maximale Anzahl Dateien (Kostenbremse)"
        required: false
        default: "60"
  schedule:
    - cron: "17 3 * * 1"   # montags 03:17 UTC (Schedule läuft nur, wenn die Datei im Default-Branch liegt)

permissions:
  contents: read

concurrency:
  group: ai-autofix
  cancel-in-progress: false

env:
  BASE_BRANCH: test
  SOURCE_DIR: serviceffmpeg
  # Standard-Referenz für ALLE Läufe (push, schedule, dispatch).
  # Dispatch-Eingaben überschreiben sie; im Dispatch "none" = ohne Vergleich.
  REFERENCE_REPO: carlgustav19660-dev/exteplayer3
  REFERENCE_REF: fix-all-sps-pps
  REFERENCE_SUBDIR: ""
  # Standard-Prüfschwerpunkt (zusätzlich zur allgemeinen Fehlersuche); Dispatch-Eingabe "focus" überschreibt ihn
  DEFAULT_FOCUS: "Behandlung von H.264 SPS/PPS (Parametersätze, Extradata, Einfügen vor IDR-Frames) im Vergleich zur Referenz"

jobs:
  # ------------------------------------------------------------------
  # Job 1: Dateien ermitteln
  # ------------------------------------------------------------------
  detect-files:
    runs-on: ubuntu-24.04
    outputs:
      files: ${{ steps.list.outputs.files }}
      has_files: ${{ steps.list.outputs.has_files }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.BASE_BRANCH }}
          persist-credentials: false

      - name: List C/C++ files
        id: list
        env:
          MAX_FILES: ${{ inputs.max_files || (github.event_name == 'push' && '5' || '60') }}
        run: |
          FILES=$(find "$SOURCE_DIR" -type f \
                    \( -name '*.cpp' -o -name '*.c' -o -name '*.h' -o -name '*.hpp' -o -name '*.cc' \) \
                    ! -name 'bcm_ioctls.h' ! -name 'config.h' ! -name 'version.h' \
                    ! -path '*/.git/*' ! -path '*/build/*' ! -path '*/tmp/*' \
                  | sort \
                  | jq -R -s -c --argjson max "$MAX_FILES" 'split("\n") | map(select(length > 0)) | .[:$max]')
          COUNT=$(echo "$FILES" | jq 'length')
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          echo "has_files=$([ "$COUNT" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "Gefundene Dateien: $COUNT"
          echo "$FILES" | jq -r '.[]'

  # ------------------------------------------------------------------
  # Job 2: Jede Datei in eigenem Job
  # ------------------------------------------------------------------
  process-file:
    needs: detect-files
    if: needs.detect-files.outputs.has_files == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        file: ${{ fromJson(needs.detect-files.outputs.files) }}
    steps:
      - name: Referenz auflösen
        id: ref
        env:
          IN_REPO: ${{ inputs.reference_repo }}
          IN_REF: ${{ inputs.reference_ref }}
          IN_SUB: ${{ inputs.reference_subdir }}
        run: |
          repo="${IN_REPO:-$REFERENCE_REPO}"
          ref="${IN_REF:-$REFERENCE_REF}"
          sub="${IN_SUB:-$REFERENCE_SUBDIR}"
          if [ "$repo" = "none" ]; then repo=""; fi
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "ref=$ref"   >> "$GITHUB_OUTPUT"
          echo "subdir=$sub" >> "$GITHUB_OUTPUT"
          echo "Referenz: ${repo:-keine} @ ${ref:-default}"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.BASE_BRANCH }}
          persist-credentials: false

      - name: Checkout Referenz-Repo
        if: steps.ref.outputs.repo != ''
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.ref.outputs.repo }}
          ref: ${{ steps.ref.outputs.ref }}
          path: ref-src
          # Für private Referenz-Repos: Secret REFERENCE_REPO_TOKEN (PAT mit Lesezugriff) anlegen
          token: ${{ secrets.REFERENCE_REPO_TOKEN || github.token }}
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests

      - name: Process ${{ matrix.file }}
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TARGET_FILE: ${{ matrix.file }}
          AI_FIX_FOCUS: ${{ inputs.focus || env.DEFAULT_FOCUS }}
          AI_FIX_REF_MAX_CHARS: "90000"   # container_ffmpeg.c ist groß
          AI_FIX_REF_DIR: ${{ steps.ref.outputs.repo != '' && format('{0}/ref-src', github.workspace) || '' }}
          AI_FIX_REF_SUBDIR: ${{ steps.ref.outputs.subdir }}
          AI_FIX_REF_MAP: ${{ steps.ref.outputs.repo != '' && '.github/ai-autofix-refmap.json' || '' }}
        run: python scripts/ai_fix_single.py "$TARGET_FILE"

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: result-${{ strategy.job-index }}
          path: /tmp/ai_fix_result_*.json
          if-no-files-found: ignore
          retention-days: 3

  # ------------------------------------------------------------------
  # Job 3: Patches einsammeln und einen PR erstellen
  # ------------------------------------------------------------------
  create-pr:
    needs: process-file
    if: ${{ !cancelled() && needs.process-file.result != 'skipped' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.BASE_BRANCH }}

      - name: Download results
        uses: actions/download-artifact@v7
        with:
          pattern: result-*
          path: /tmp/ai-results

      - name: Apply patches
        id: apply
        run: |
          python3 - <<'PYEOF'
          import glob, json, os, subprocess
          from pathlib import Path

          applied, failed, notes, rows = [], [], [], []
          for f in sorted(glob.glob("/tmp/ai-results/*/ai_fix_result_*.json")):
              try:
                  d = json.loads(Path(f).read_text(encoding="utf-8"))
              except Exception:
                  continue
              status = d.get("summary") or "-"
              if d.get("error"):
                  notes.append(f"- `{d['file']}`: Fehler – {d['error']}")
                  status = "Fehler: " + d["error"][:120]
              rows.append((d["file"], "geändert" if d.get("changed") else "keine Änderung", status))
              if not d.get("changed") or not d.get("patch"):
                  continue
              chk = subprocess.run(["git", "apply", "--check", "--whitespace=nowarn", "-"],
                                   input=d["patch"], text=True, capture_output=True)
              if chk.returncode != 0:
                  failed.append(d["file"])
                  continue
              subprocess.run(["git", "apply", "--whitespace=nowarn", "-"],
                             input=d["patch"], text=True, check=True)
              applied.append(d)

          lines = ["## 🤖 AI-Autofix (DeepSeek)", "",
                   f"**{len(applied)} Datei(en)** mit Änderungsvorschlägen. "
                   "Bitte jede Änderung im Diff prüfen und bauen/testen, bevor gemergt wird.", ""]
          for d in applied:
              ref = f" _(Vergleich mit `{d['reference']}`)_" if d.get("reference") else ""
              lines.append(f"### `{d['file']}`{ref}")
              for c in d.get("changes", []):
                  lines.append(f"- **{c.get('severity', 'bug')}**: {c.get('description', '')}")
              lines.append("")
          if failed:
              lines += ["### Nicht anwendbare Patches (Basis hat sich geändert)"] + [f"- `{x}`" for x in failed] + [""]
          if notes:
              lines += ["### Hinweise"] + notes + [""]
          lines += ["---",
                    "**Merge** = übernehmen, **Close** = verwerfen. "
                    "In beiden Fällen wird der Branch `ai/autofix` automatisch gelöscht."]

          Path("/tmp/ai_fix_body.md").write_text("\n".join(lines), encoding="utf-8")

          # Übersicht über ALLE Dateien im Job-Summary (sichtbar auch ohne PR)
          summ = ["## AI-Autofix – Übersicht", "", "| Datei | Ergebnis | Details |", "|---|---|---|"]
          for fn, res, det in rows:
              summ.append(f"| `{fn}` | {res} | {det.replace('|', '/')} |")
          if os.environ.get("GITHUB_STEP_SUMMARY"):
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as sf:
                  sf.write("\n".join(summ) + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"changed={len(applied)}\n")
          print(f"Geänderte Dateien: {len(applied)}, nicht anwendbar: {len(failed)}")
          PYEOF

      - name: Ensure labels exist
        if: steps.apply.outputs.changed != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create automated  --color 0e8a16 --description "Automatisch erstellt" --force || true
          gh label create ai-autofix --color 5319e7 --description "KI-Änderungsvorschlag" --force || true

      - name: Create PR
        if: steps.apply.outputs.changed != '0'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: ${{ env.BASE_BRANCH }}
          branch: ai/autofix
          delete-branch: true
          add-paths: ${{ env.SOURCE_DIR }}
          title: "[AI] Autofix-Vorschlag"
          commit-message: "chore(ai-autofix): automatisierte Code-Verbesserungen"
          body-path: /tmp/ai_fix_body.md
          labels: |
            automated
            ai-autofix
